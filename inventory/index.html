<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeheng Inventory</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6f8; color: #111827; font-family: Arial, "Noto Sans Thai", sans-serif; }
    header { background: #101827; color: #fff; padding: 18px; }
    main, .inner { max-width: 1100px; margin: 0 auto; }
    main { padding: 16px; }
    h1 { font-size: 24px; margin: 0; }
    a { color: #2563eb; font-weight: 700; text-decoration: none; }
    .toolbar { align-items: center; display: flex; gap: 10px; justify-content: space-between; margin-bottom: 12px; }
    input { border: 1px solid #cbd5e1; border-radius: 8px; min-height: 40px; padding: 8px 10px; width: min(360px, 100%); }
    .table-wrap { background: #fff; border: 1px solid #d9e0e8; border-radius: 8px; overflow: auto; }
    table { border-collapse: collapse; min-width: 720px; width: 100%; }
    th, td { border-bottom: 1px solid #d9e0e8; padding: 10px; text-align: left; }
    th { background: #f8fafc; color: #334155; font-size: 13px; }
    .number { text-align: right; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <h1>Inventory Master</h1>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <a href="../">กลับหน้าแรก</a>
      <input id="search" placeholder="ค้นหารายการ">
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>รายการ</th><th>หมวด</th><th>หน่วย</th><th class="number">คงเหลือตั้งต้น</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script src="data.js"></script>
  <script>
    const rows = document.getElementById('rows');
    const search = document.getElementById('search');

    function render() {
      const query = search.value.trim().toLowerCase();
      rows.innerHTML = ingredients
        .filter((item) => !query || `${item.name} ${item.category}`.toLowerCase().includes(query))
        .map((item) => `
          <tr>
            <td>${item.name}</td>
            <td>${item.category}</td>
            <td>${item.unit}</td>
            <td class="number">${item.qty}</td>
          </tr>
        `)
        .join('');
    }

    search.addEventListener('input', render);
    render();
  </script>
</body>
</html>
