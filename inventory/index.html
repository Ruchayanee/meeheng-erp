<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeheng Inventory</title><style>body{margin:0;background:#f7f1e8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#3f2a20}header{padding:30px 24px;background:#9f1d20;color:#fffaf4;border-bottom-left-radius:28px;border-bottom-right-radius:28px}.wrap{max-width:960px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:#fffaf4;border-radius:24px;padding:22px;box-shadow:0 10px 30px rgba(93,32,24,.08)}h1,h2,h3,p{margin:0}.muted{color:#8f6e5d}.qty{font-size:36px;font-weight:800;color:#9f1d20;margin-top:10px}button{margin-top:18px;width:100%;padding:15px;border:0;border-radius:16px;background:#aa2326;color:#fffaf4;font-size:16px;font-weight:700}input{width:100%;box-sizing:border-box;padding:14px;border-radius:14px;border:1px solid #ead2ba;margin-top:10px}</style></head><body><header><h1>Inventory Center</h1><p style="margin-top:10px">ระบบจัดการสต๊อกวัตถุดิบ มีเฮงฟู้ด</p></header><main class="wrap"><section class="grid"><div class="card"><h3>หมูบด</h3><div class="qty">0 KG</div><p class="muted">วัตถุดิบหลัก</p></div><div class="card"><h3>แป้ง</h3><div class="qty">0 KG</div><p class="muted">ส่วนผสม</p></div><div class="card"><h3>ถุงบรรจุ</h3><div class="qty">0</div><p class="muted">Packaging</p></div></section><section class="card" style="margin-top:22px"><h2>ปรับสต๊อก</h2><p class="muted" style="margin-top:8px">สำหรับผู้บริหารและฝ่ายสต๊อก</p><input placeholder="ชื่อวัตถุดิบ"><input placeholder="จำนวน เช่น +10 หรือ -5"><button>บันทึกการปรับสต๊อก</button></section></main></body></html>
