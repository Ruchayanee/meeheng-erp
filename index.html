<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meeheng Food Super App</title>

<meta name="theme-color" content="#9f1d20">

<style>
body{
margin:0;
background:#f4f1ec;
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
color:#222;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.top{
text-align:right;
font-size:28px;
padding-top:10px;
}

.logo-wrap{
text-align:center;
margin-top:30px;
}

.logo{
width:220px;
height:220px;
object-fit:cover;
border-radius:50%;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.title{
font-size:42px;
font-weight:800;
margin-top:20px;
color:#8f1111;
}

.subtitle{
font-size:20px;
color:#666;
margin-top:8px;
font-weight:600;
}

.menu{
margin-top:40px;
display:grid;
gap:22px;
}

.card{
border:none;
border-radius:28px;
padding:26px;
font-size:28px;
font-weight:800;
color:white;
text-align:left;
box-shadow:0 10px 24px rgba(0,0,0,.12);
}

.card small{
display:block;
font-size:14px;
margin-top:10px;
opacity:.9;
}

.account{
background:#1e2b45;
}

.stock{
background:#0ca36c;
}

.vendor{
background:#f2a20c;
}

.footer{
text-align:center;
margin-top:30px;
font-size:13px;
color:#777;
}
</style>
</head>

<body>

<div class="container">

<div class="top">🔔</div>

<div class="logo-wrap">
<img src="https://raw.githubusercontent.com/Ruchayanee/meeheng-erp/main/assets/logo.svg" class="logo">

<div class="title">
Mee Heng Food
</div>

<div class="subtitle">
Super App Management System
</div>
</div>

<div class="menu">

<button class="card account">
📊 ระบบบัญชี
<small>
รายรับ รายจ่าย กำไร และยอดขายรวม
</small>
</button>

<button class="card stock"
onclick="window.location.href='/meeheng-erp/inventory/'">
📦 ระบบสต๊อก
<small>
ตรวจสอบวัตถุดิบและปรับสต๊อก
</small>
</button>

<button class="card vendor"
onclick="window.open('/meeheng-erp/vendor-app/')">
🧾 ระบบแม่ค้า
<small>
บันทึกยอดขายผ่าน Vendor App
</small>
</button>

</div>

<div class="footer">
Meeheng Operations Center
</div>

</div>

</body>
</html>
