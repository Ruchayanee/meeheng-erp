<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeheng Food ERP</title>
  <style>
    body { font-family: Arial; background:#f5f6fa; margin:0; }
    header { background:#111827; color:white; padding:20px; }
    .container { padding:16px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
    .card { background:white; padding:18px; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    h3 { margin-top:0; }
    button { width:100%; padding:16px; border:0; border-radius:12px; font-size:18px; }
  </style>
</head>
<body>
<header>
  <h2>Meeheng Food ERP</h2>
  <p>Factory • Stock • Sales • Accounting</p>
</header>

<div class="container">
  <div class="grid">
    <div class="card">
      <h3>Production</h3>
      <p>ระบบผลิต</p>
    </div>

    <div class="card">
      <h3>Inventory</h3>
      <p>ระบบสต๊อก</p>
    </div>

    <div class="card">
      <h3>Vendor Sales</h3>
      <p>ระบบแม่ค้า</p>
    </div>

    <div class="card">
      <h3>Accounting</h3>
      <p>ระบบบัญชี</p>
    </div>
  </div>
</div>
</body>
</html>
