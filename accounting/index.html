<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeheng Accounting</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6f8; color: #111827; font-family: Arial, "Noto Sans Thai", sans-serif; }
    header { background: #101827; color: #fff; padding: 18px; }
    main { max-width: 860px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 24px; margin: 0; }
    .card { background: #fff; border: 1px solid #d9e0e8; border-radius: 8px; margin-bottom: 12px; padding: 14px; }
    form { display: grid; gap: 12px; }
    label { color: #334155; display: grid; font-size: 13px; font-weight: 700; gap: 6px; }
    input, select { border: 1px solid #cbd5e1; border-radius: 8px; min-height: 42px; padding: 9px 10px; width: 100%; }
    button { background: #15803d; border: 0; border-radius: 8px; color: #fff; cursor: pointer; font: inherit; font-weight: 700; min-height: 42px; padding: 10px 14px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #d9e0e8; padding: 8px; text-align: left; }
    .number { text-align: right; }
  </style>
</head>
<body>
  <header>
    <h1>Accounting Draft</h1>
  </header>
  <main>
    <section class="card">
      <form id="expenseForm">
        <label>หมวด
          <select name="category">
            <option>ค่าแก๊ส</option>
            <option>ค่าแผง</option>
            <option>ค่าแรง</option>
            <option>ค่าขนส่ง</option>
            <option>ทั่วไป</option>
          </select>
        </label>
        <label>รายละเอียด
          <input name="description" required>
        </label>
        <label>ยอดเงิน
          <input name="amount" type="number" min="0.01" step="0.01" required>
        </label>
        <button id="saveExpenseBtn" type="submit">บันทึกในเครื่องนี้</button>
      </form>
    </section>
    <section class="card">
      <table>
        <thead><tr><th>เวลา</th><th>หมวด</th><th>รายละเอียด</th><th class="number">ยอดเงิน</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
