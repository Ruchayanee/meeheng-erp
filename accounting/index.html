<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Meeheng Accounting</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{font-family:'Kanit',sans-serif;background:#f8f5f2;display:flex;flex-direction:column;align-items:center;min-height:100vh;margin:0;text-align:center;padding:20px;color:#2b2b2b}.topbar{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back-btn{text-decoration:none;background:#1e293b;color:#fff;padding:12px 18px;border-radius:16px;font-size:16px;font-weight:600}.notify{font-size:30px}.logo{width:240px;max-width:80vw;mix-blend-mode:multiply;margin-top:10px}.subtitle{color:#777;font-size:22px;margin-top:-30px;margin-bottom:20px;letter-spacing:.5px;font-weight:600}.grid{width:100%;max-width:900px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:16px}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 20px rgba(0,0,0,.08);text-align:left}.card h3{margin:0;font-size:22px}.value{font-size:42px;font-weight:800;margin-top:12px}.red{background:linear-gradient(135deg,#a31212,#d62828);color:#fff}.yellow{background:linear-gradient(135deg,#d48b00,#ffb703);color:#fff}.green{background:linear-gradient(135deg,#0b8d4d,#17b169);color:#fff}.dark{background:#1e293b;color:#fff}.section{width:100%;max-width:900px;margin-top:24px}.list{background:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 20px rgba(0,0,0,.08)}.item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:none}</style></head><body><div class="topbar"><a class="back-btn" href="/meeheng-erp/">← กลับหน้าเมนู</a><div class="notify">🔔</div></div><img class="logo" src="https://raw.githubusercontent.com/Ruchayanee/meeheng-erp/main/assets/IMG_3283_TRANSPARENT.png">
