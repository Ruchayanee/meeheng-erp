<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeheng Vendor</title><style>body{font-family:Arial;margin:0;background:#f3f4f6}header{background:#111827;color:white;padding:22px}.wrap{max-width:680px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #0001}button{width:100%;padding:22px;margin:8px 0;border:0;border-radius:16px;background:#111827;color:white;font-size:22px;font-weight:bold}.muted{color:#666}.stat{font-size:34px;font-weight:bold}</style></head><body><header><h1>Meeheng Vendor App</h1><p>Sales input only</p></header><div class="wrap"><div class="card"><h2>Vendor A</h2><p class="muted">Today sales</p><div class="stat" id="total">0</div></div><div class="card"><h2>Record Sale</h2><button onclick="sale('Small Meatball',35)">+1 Small Meatball</button><button onclick="sale('Large Meatball',45)">+1 Large Meatball</button><button onclick="sale('Moo Yor',50)">+1 Moo Yor</button></div><div class="card"><h2>Latest Input</h2><p id="log" class="muted">No sale yet</p></div></div><script>let total=0;function sale(name,price){total+=price;document.getElementById('total').innerText='THB '+total;document.getElementById('log').innerText='Recorded: '+name+' / THB '+price+' / '+new Date().toLocaleTimeString();}</script></body></html>
