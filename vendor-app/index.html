<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeheng Vendor</title><style>body{font-family:'Arial Rounded MT Bold',Arial,sans-serif;margin:0;background:#fff4df;color:#3b1f17}header{background:#a52222;color:#fff4df;padding:24px;border-bottom:6px solid #f2c98b}.wrap{max-width:720px;margin:auto;padding:18px}.card{background:#fffaf0;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 2px 10px #0001;border:1px solid #f1d3a2}button{width:100%;padding:22px;margin:8px 0;border:0;border-radius:18px;background:#b42828;color:#fff9ed;font-size:22px;font-weight:bold}select{width:100%;padding:16px;border-radius:16px;border:1px solid #e7c28c;background:#fffdf8;font-size:16px;margin-top:10px}.muted{color:#8a6454}.stat{font-size:34px;font-weight:bold;color:#a52222}.ok{color:green}.err{color:#a52222}</style></head><body><header><h1>Meeheng Vendor App</h1><p>ระบบบันทึกยอดขายแม่ค้า</p></header><div class="wrap"><div class="card"><h2>เลือกแม่ค้า</h2><select id="vendor"><option>ตุ่ย</option><option>ยุ</option><option>แบน</option><option>มิ</option></select><p class="muted" style="margin-top:12px">ในอนาคตจะเชื่อมต่อกับ LINE LIFF และ Line Official Account</p></div><div class="card"><h2>ยอดขายที่กดในหน้านี้</h2><div class="stat" id="total">THB 0</div></div><div class="card"><h2>กดบันทึกยอดขาย</h2><button onclick="sale('ลูกชิ้นเล็ก',35)">+1 ลูกชิ้นเล็ก</button><button onclick="sale('ลูกชิ้นใหญ่',45)">+1 ลูกชิ้นใหญ่</button><button onclick="sale('หมูยอ',50)">+1 หมูยอ</button></div><div class="card"><h2>สถานะล่าสุด</h2><p id="log" class="muted">ยังไม่มีรายการ</p></div></div><script>const API='https://script.google.com/macros/s/AKfycbx1eFGVN_Qfh-1yqjTHLcyfeC0kJ1YQ7CF8eKRiqyOoga033e11NTy89ogK6ZsMPltB/exec';let total=0;function sale(product,price){const vendor=document.getElementById('vendor').value;total+=price;document.getElementById('total').innerText='THB '+total;document.getElementById('log').innerText='กำลังบันทึก...';fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({vendor:vendor,product:product,qty:1,price:price})}).then(function(){document.getElementById('log').className='ok';document.getElementById('log').innerText='บันทึกแล้ว: '+vendor+' / '+product+' / THB '+price+' / '+new Date().toLocaleTimeString();}).catch(function(){document.getElementById('log').className='err';document.getElementById('log').innerText='บันทึกไม่สำเร็จ กรุณาลองใหม่';});}</script></body></html>
