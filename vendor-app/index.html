<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeheng Vendor</title><style>body{font-family:Arial;margin:0;background:#f3f4f6}header{background:#111827;color:white;padding:22px}.wrap{max-width:680px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #0001}button{width:100%;padding:22px;margin:8px 0;border:0;border-radius:16px;background:#111827;color:white;font-size:22px;font-weight:bold}.muted{color:#666}.stat{font-size:34px;font-weight:bold}.ok{color:green}.err{color:red}</style></head><body><header><h1>Meeheng Vendor App</h1><p>ระบบบันทึกยอดขายแม่ค้า</p></header><div class="wrap"><div class="card"><h2>แม่ค้า A</h2><p class="muted">ยอดขายที่กดในหน้านี้</p><div class="stat" id="total">0</div></div><div class="card"><h2>กดบันทึกยอดขาย</h2><button onclick="sale('ลูกชิ้นเล็ก',35)">+1 ลูกชิ้นเล็ก</button><button onclick="sale('ลูกชิ้นใหญ่',45)">+1 ลูกชิ้นใหญ่</button><button onclick="sale('หมูยอ',50)">+1 หมูยอ</button></div><div class="card"><h2>สถานะล่าสุด</h2><p id="log" class="muted">ยังไม่มีรายการ</p></div></div><script>const API='https://script.google.com/macros/s/AKfycbx1eFGVN_Qfh-1yqjTHLcyfeC0kJ1YQ7CF8eKRiqyOoga033e11NTy89ogK6ZsMPltB/exec';let total=0;function sale(product,price){total+=price;document.getElementById('total').innerText='THB '+total;document.getElementById('log').innerText='กำลังบันทึก...';fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({vendor:'แม่ค้า A',product:product,qty:1,price:price})}).then(function(){document.getElementById('log').className='ok';document.getElementById('log').innerText='บันทึกแล้ว: '+product+' / THB '+price+' / '+new Date().toLocaleTimeString();}).catch(function(){document.getElementById('log').className='err';document.getElementById('log').innerText='บันทึกไม่สำเร็จ กรุณาลองใหม่';});}</script></body></html>
