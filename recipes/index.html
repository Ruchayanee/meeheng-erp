<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Meeheng Recipe Management</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{font-family:'Kanit',sans-serif;background:#f8f5f2;margin:0;padding:20px;color:#222}.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.back{background:#1e293b;color:#fff;padding:12px 18px;border-radius:16px;text-decoration:none;font-weight:700}.container{max-width:1100px;margin:20px auto}.logo{text-align:center}.logo img{width:220px;max-width:80vw;object-fit:contain}.title{text-align:center;font-size:38px;font-weight:800;color:#a31212;margin-top:10px}.subtitle{text-align:center;color:#777;margin-bottom:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 20px rgba(0,0,0,.08)}h2{margin-top:0}.input{width:100%;padding:14px;border-radius:14px;border:1px solid #ddd;margin-top:10px;font-family:'Kanit',sans-serif;box-sizing:border-box}.btn{margin-top:16px;background:linear-gradient(135deg,#a31212,#d62828);color:#fff;border:none;padding:14px 18px;border-radius:16px;font-weight:700;width:100%;font-size:16px}.btn-green{background:linear-gradient(135deg,#0b8d4d,#17b169)}.price-item,.recipe-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.ingredient-list{margin-top:16px}.ingredient-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:10px}.mini-btn{background:#17b169;color:#fff;border:none;padding:12px;border-radius:14px;font-weight:700;width:100%;margin-top:12px}.stock-link{display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,#0b8d4d,#17b169);color:#fff;padding:16px;border-radius:18px;font-weight:700;margin-top:20px}</style></head><body><div class="top"><a class="back" href="/meeheng-erp/">← กลับหน้าเมนู</a><div style="font-size:30px">🧪</div></div><div class="container"><div class="logo"><img src="https://raw.githubusercontent.com/Ruchayanee/meeheng-erp/main/assets/IMG_3283_TRANSPARENT.png"></div><div class="title">Recipe Management</div><div class="subtitle">ระบบจัดการสูตรผลิตและต้นทุนวัตถุดิบ</div><div class="grid"><div class="card"><h2>เพิ่ม / แก้ไขสูตร</h2><input class="input" placeholder="ชื่อสูตร เช่น ลูกชิ้นสูตรใหญ่"><div class="ingredient-list" id="ingredientList"><div class="ingredient-row"><input class="input" placeholder="วัตถุดิบ"><input class="input" placeholder="จำนวน"><input class="input" placeholder="หน่วย"></div></div><button class="mini-btn" onclick="addIngredientRow()">+ เพิ่มส่วนผสม</button><button class="btn">บันทึกทับสูตรเดิม</button><a class="stock-link" href="/meeheng-erp/inventory/">📦 ไปยังระบบสต๊อกวัตถุดิบ</a></div><div class="card"><h2>ปรับราคาวัตถุดิบ</h2><input class="input" placeholder="ชื่อวัตถุดิบ"><input class="input" placeholder="ราคาใหม่"><button class="btn btn-green">อัปเดตราคา</button><div style="margin-top:20px"><div class="price-item"><strong>แป้ง</strong><span>฿ 0</span></div><div class="price-item"><strong>กลูเตน</strong><span>฿ 0</span></div><div class="price-item"><strong>พริกไทยขาว</strong><span>฿ 0</span></div></div></div></div><div class="card" style="margin-top:24px"><h2>สูตรปัจจุบัน</h2><div class="recipe-item"><strong>ลูกชิ้นสูตรใหญ่</strong><span>V1</span></div><div class="recipe-item"><strong>หมูยอสูตรหลัก</strong><span>V1</span></div></div></div><script>function addIngredientRow(){const container=document.getElementById('ingredientList');const row=document.createElement('div');row.className='ingredient-row';row.innerHTML='<input class="input" placeholder="วัตถุดิบ"><input class="input" placeholder="จำนวน"><input class="input" placeholder="หน่วย">';container.appendChild(row);}</script></body></html>
