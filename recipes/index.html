<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeheng Recipes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6f8; color: #111827; font-family: Arial, "Noto Sans Thai", sans-serif; }
    header { background: #101827; color: #fff; padding: 18px; }
    main, .inner { max-width: 1100px; margin: 0 auto; }
    main { padding: 16px; }
    h1 { font-size: 24px; margin: 0; }
    h2 { font-size: 18px; margin: 0 0 10px; }
    a { color: #2563eb; font-weight: 700; text-decoration: none; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); margin-top: 12px; }
    .card { background: #fff; border: 1px solid #d9e0e8; border-radius: 8px; padding: 14px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #d9e0e8; padding: 8px; text-align: left; }
    th { background: #f8fafc; color: #334155; font-size: 13px; }
    .number { text-align: right; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <h1>Production Recipes</h1>
    </div>
  </header>
  <main>
    <a href="../">กลับหน้าแรก</a>
    <div class="grid" id="recipes"></div>
  </main>
  <script>
    async function loadRecipes() {
      const response = await fetch('recipes.json');
      const recipes = await response.json();
      document.getElementById('recipes').innerHTML = recipes.map((recipe) => `
        <section class="card">
          <h2>${recipe.name} ${recipe.version}</h2>
          <table>
            <thead><tr><th>วัตถุดิบ</th><th class="number">จำนวน</th><th>หน่วย</th></tr></thead>
            <tbody>
              ${recipe.ingredients.map((item) => `
                <tr><td>${item.name}</td><td class="number">${item.amount}</td><td>${item.unit}</td></tr>
              `).join('')}
            </tbody>
          </table>
        </section>
      `).join('');
    }

    loadRecipes();
  </script>
</body>
</html>
